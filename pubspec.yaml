name: mechanic_assistant
description: "دستیار مکانیک خودرو — ثبت تعمیرات، قطعات و فاکتور به صورت آفلاین"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: any
  go_router: any
  drift: any
  drift_flutter: any
  sqlite3_flutter_libs: any
  path_provider: any
  path: any
  camera: any
  permission_handler: any
  url_launcher: any
  share_plus: 11.0.0
  intl: any
  shamsi_date: any
  uuid: any
  tflite_flutter: ^0.11.0
  image: ^4.5.4
  pdf: ^3.13.0
  file_picker: 8.1.7
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  drift_dev: any
  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/nedicar_app_icon.png
  adaptive_icon_background: "#F5F8FC"
  adaptive_icon_foreground: assets/branding/nedicar_app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/branding/nedicar_logo.png
    - assets/branding/pelak.jpg
    - assets/models/
    - assets/models/iran_plate_models_config.json
    - assets/tessdata_config.json
    - assets/tessdata/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
